    <!-- Brilliant.org typography match:
         Brilliant uses the bespoke "coFoBrilliantFont" (geometric sans) by Contrast
         Foundry for headings + body, and "coFoRobertFont" (serif) for accents.
         Those are proprietary, so we mirror the look with the same foundry's free
         TikTok Sans (geometric sans, closest match) + Poppins/Inter fallbacks, and
         Fraunces as the optional serif accent. -->
    <link
      href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,400..800&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
