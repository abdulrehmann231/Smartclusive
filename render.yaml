# Render Blueprint for Smartclusive
# See RENDER_DEPLOYMENT.md for detailed instructions.

services:
  # Backend API + Socket.IO
  - type: web
    name: smartclusive-api
    runtime: python
    plan: standard
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip setuptools wheel &&
      pip install -r requirements.txt &&
      python scripts/generate_lesson_videos.py
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartclusive-db
          property: connectionString
      - key: DETECT_DEMO_FALLBACK
        value: "1"
      - key: MIN_DECK_SIZE
        value: "3"
      - key: CORS_ORIGINS
        value: "*"

  # Static React frontend
  - type: static
    name: smartclusive-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          name: smartclusive-api
          type: web
          property: url

databases:
  - name: smartclusive-db
    plan: free
    databaseName: smartclusive
    user: smartclusive
